<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Desil Keluarga</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 25px;
    }
    h5 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus {
      border-color: #3498db;
    }
    button {
      padding: 12px 24px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2980b9;
    }
    #loading {
      display: none;
      text-align: center;
      color: #7f8c8d;
      margin: 20px 0;
      font-weight: bold;
    }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      background-color: #fff;
    }
    .desil-box {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .desil-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.9;
      margin-bottom: 5px;
    }
    .desil-value {
      font-size: 48px;
      font-weight: 800;
      line-height: 1.1;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
    }
    .detail-table td {
      padding: 8px 4px;
      vertical-align: top;
      font-size: 15px;
    }
    .detail-table td.label {
      width: 40%;
      color: #64748b;
      font-weight: 600;
    }
    .detail-table td.value {
      width: 60%;
      color: #1e293b;
      font-weight: 500;
    }
    .no-result {
      text-align: center;
      color: #e74c3c;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Cek Data Desil Keluarga Desa Tunggur</h2>
  <h5>Data Per September 2026</h5>
  <h5>Untuk Penuruan Desil bisa Akses di Link Berikut <a href="https://dtsen-form.bps.go.id/">dtsen-form.bps.go.id/</a></h5>
  <div class="search-box">
    <input type="text" id="keyword" placeholder="Masukkan No KK atau Nama Kepala Keluarga..." onkeypress="handleKeyPress(event)">
    <button onclick="prosesCari()">Cari</button>
  </div>
  
  <div id="loading">Memproses pencarian data...</div>
  <div id="result"></div>
</div>

<script>
  // GANTI URL DI BAWAH DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbx.../exec";

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      prosesCari();
    }
  }

  async function prosesCari() {
    const input = document.getElementById('keyword').value.trim();
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');
    
    if (!input) {
      alert("Silakan masukkan Nomor KK atau Nama Kepala Keluarga terlebih dahulu.");
      return;
    }
    
    resultDiv.innerHTML = '';
    loadingDiv.style.display = 'block';
    
    try {
      // Google Apps Script redirect otomatis, fetch default (follow redirects) akan menanganinya
      const response = await fetch(`${API_URL}?keyword=${encodeURIComponent(input)}`);
      const res = await response.json();
      
      loadingDiv.style.display = 'none';

      if (res.status === 'error') {
        resultDiv.innerHTML = `<div class="no-result">${res.message}</div>`;
        return;
      }
      
      tampilkanHasil(res.data);
    } catch (error) {
      loadingDiv.style.display = 'none';
      resultDiv.innerHTML = `<div class="no-result">Terjadi kesalahan koneksi/server: ${error.message}</div>`;
    }
  }

  function tampilkanHasil(data) {
    const resultDiv = document.getElementById('result');
    
    if (!data || data.length === 0) {
      resultDiv.innerHTML = '<div class="no-result">Data tidak ditemukan. Pastikan No KK atau Nama yang dimasukkan sudah benar.</div>';
      return;
    }
    
    let html = '';
    data.forEach(item => {
      html += `
        <div class="card">
          <div class="desil-box">
            <div class="desil-title">Kategori Kesejahteraan</div>
            <div class="desil-value">DESIL ${item.desil}</div>
          </div>
          <table class="detail-table">
            <tr><td class="label">No KK</td><td class="value">: ${item.noKK}</td></tr>
            <tr><td class="label">Nama Kepala Keluarga</td><td class="value">: ${item.namaKK}</td></tr>
            <tr><td class="label">Alamat</td><td class="value">: ${item.alamat}</td></tr>
            <tr><td class="label">RT / RW</td><td class="value">: RT ${item.rt} / RW ${item.rw}</td></tr>
          </table>
        </div>
      `;
    });
    
    resultDiv.innerHTML = html;
  }
</script>

</body>
</html>
